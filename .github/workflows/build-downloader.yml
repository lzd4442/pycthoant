name: Build Downloader EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name Pycthoant-Downloader downloader/downloader.py

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Tag: $TAG_NAME"

          # Find or create release for this tag
          RELEASE_ID=$(gh release view "$TAG_NAME" --json id --jq .id 2>/dev/null || echo "")

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating release..."
            gh release create "$TAG_NAME" --title "Pycthoant Downloader $TAG_NAME" --notes "Pycthoant 下载器 Windows 可执行文件"
          fi

          # Upload exe
          gh release upload "$TAG_NAME" dist/Pycthoant-Downloader.exe --clobber
