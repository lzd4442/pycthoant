name: Build Downloader EXE

on:
  push:
    branches: [main]
    paths:
      - downloader/**
      - .github/workflows/build-downloader.yml
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name Pycthoant-Downloader `
            --add-data "downloader;downloader" `
            --console `
            --icon NONE `
            downloader/downloader.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pycthoant-Downloader
          path: dist/Pycthoant-Downloader.exe

      - name: Upload to Release
        if: github.event_name == 'release'
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            dist/Pycthoant-Downloader.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
